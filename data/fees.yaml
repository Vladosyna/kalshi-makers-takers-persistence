# GENERATED by tools/build_fees_yaml.py on 2026-07-28 -- do not hand-edit.
#
# Kalshi fee history, sourced from primary artifacts (spec S3/S7): a
# right-continuous step function keyed on trade FILL timestamp, never
# seeded from a 'current' row backwards.
#
# Evidence, all archived in this repo:
#   docs/sources/fees/*.pdf                 16 dated captures of Kalshi's own
#                                           published fee schedule, 2021-07 .. 2026-02
#   docs/sources/fees/version_history.json  machine-parsed from those PDFs
#   data/series_fee_catalog.json            Kalshi API per-series fee_type,
#                                           frozen 2026-07-28T11:45:34Z
#
# Entry shape:
#   form: quadratic          fee = ceil_to_cent(rate * C * P * (1-P))
#         flat_per_contract  fee = ceil_to_cent(rate * C)      <- 2025-05/06 maker fee
#         none               fee = 0
#   scope.kind: all | ticker_prefix | series
#         Most specific applicable entry wins: series > ticker_prefix > all,
#         ties broken by the latest effective_from at or before the fill.
#
# Three things the earlier hand-written schedule had wrong, each visible
# in the artifacts and each load-bearing:
#   1. The maker fee is a PER-SERIES surcharge, never market-wide. Resting
#      orders are free "unless they are included in our 'Maker Fees'
#      section" -- the general section's own words.
#   2. Its first form was FLAT per contract, round up(0.0025 x C), with no
#      price dependence; the quadratic 0.0175 form began 2025-07-08.
#   3. S&P500 (INX*) and NASDAQ-100 (NASDAQ100*) markets pay HALF the
#      general taker rate. That covers 18.3% of R1's in-scope universe.
# And one more: the taker rate was 0.14 in the 2021-07-20 capture.
#
# BDW's own dating -- "Kalshi began to charge fees on Makers after April
# 2025" -- is confirmed in direction and sharpened by the documents: the
# first maker fee is stamped 'Last Updated: May 13, 2025'.
#
# KNOWN GAP, carried explicitly rather than papered over: from the
# 2025-10-01 version Kalshi removed the series list from the PDF and
# deferred to kalshi.com/fee-schedule, which is client-rendered and whose
# Wayback captures are empty app shells. Per-series scope between
# 2025-09-17 and the API freeze is therefore not directly
# observable. The two dated endpoints are NOT nested (series both joined
# and left), so these are evidence bounds, not logical ones:
#   lower 103 series -- in the last dated list AND in the API catalog
#   upper 138 series -- in either
# The primary schedule below uses the lower set; the fee-sensitivity
# ribbon (spec S4) reports the span.

